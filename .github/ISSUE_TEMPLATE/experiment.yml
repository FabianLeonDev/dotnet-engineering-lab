name: Engineering experiment
description: Define a technical experiment before implementation
title: "[Experiment]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What technical question should this experiment answer?
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What do you expect to observe before running it?
    validations:
      required: true

  - type: textarea
    id: measurement
    attributes:
      label: Measurement
      description: What will be measured or observed?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must exist for the experiment to be considered complete?
    validations:
      required: true