name: Technical Task
description: Propose or track a technical implementation task.
title: "[Technical Task]: "
labels: ["technical-task"]
body:
  - type: textarea
    id: problem-motivation
    attributes:
      label: Problem / Motivation
      description: Explain the technical problem or motivation for this task.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the outcome this task should achieve.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the work included in this task.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Note technical, product, or operational constraints.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List testable conditions that define when this task is complete.
      placeholder: Use one criterion per bullet.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Describe how the implementation and acceptance criteria should be verified.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Identify potential risks or open questions.
    validations:
      required: false