name: User Story
description: Propose a user-focused capability.
title: "[User Story]: "
labels: ["user-story"]
body:
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe the capability and the value it provides.
      value: |
        As a <actor>,
        I want <capability>,
        so that <value>.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide relevant background and context for this user story.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List testable conditions that define when this story is complete.
      placeholder: Use one criterion per bullet.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe what is included in this user story.
    validations:
      required: false

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Describe what is explicitly not included.
    validations:
      required: false

  - type: textarea
    id: constraints-notes
    attributes:
      label: Constraints / Notes
      description: Note relevant technical constraints, dependencies, or other details.
    validations:
      required: false
